name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @qa-automater/types build
          pnpm --filter @qa-automater/shared build
          pnpm --filter @qa-automater/database build
          pnpm --filter @qa-automater/ui build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all apps
        run: pnpm build

  database:
    name: PostgreSQL Migrations & pgvector
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_POOL_URL: postgresql://postgres:postgres@localhost:6432/qa_automater
      DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:5432/qa_automater
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres + PgBouncer
        run: docker compose -f docker/docker-compose.yml up -d --wait

      - name: Run migrations and verify pgvector
        run: pnpm db:verify

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [quality, database]
    strategy:
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
          - name: web
            file: apps/web/Dockerfile
          - name: scan-worker
            file: workers/scan/Dockerfile
          - name: ai-worker
            file: workers/ai/Dockerfile
          - name: export-worker
            file: workers/export/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: qa-automater/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
