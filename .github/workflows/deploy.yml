name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY_PREFIX: qa-automater

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            file: apps/api/Dockerfile
          - service: web
            file: apps/web/Dockerfile
          - service: scan-worker
            file: workers/scan/Dockerfile
          - service: ai-worker
            file: workers/ai/Dockerfile
          - service: export-worker
            file: workers/export/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS Credentials
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN secret is not configured. Skipping ECR build and push."
            echo "has_aws=false" >> $GITHUB_OUTPUT
          else
            echo "has_aws=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.has_aws == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      matrix:
        service: [api, web, scan-worker, ai-worker, export-worker]
    steps:
      - name: Check AWS Credentials
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN secret is not configured. Skipping ECS deployment."
            echo "has_aws=false" >> $GITHUB_OUTPUT
          else
            echo "has_aws=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ matrix.service }} to ECS
        if: steps.check-aws.outputs.has_aws == 'true'
        run: |
          CLUSTER="${{ vars.ECS_CLUSTER_NAME }}"
          SERVICE="${{ vars.ECS_SERVICE_PREFIX }}-${{ matrix.service }}"
          echo "Updating ECS service: $SERVICE on cluster: $CLUSTER"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}"

      - name: Wait for service stability
        if: steps.check-aws.outputs.has_aws == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_PREFIX }}-${{ matrix.service }}"

      - name: Verify health endpoint
        if: matrix.service == 'api' && steps.check-aws.outputs.has_aws == 'true'
        run: |
          API_URL="${{ vars.API_HEALTH_URL }}"
          if [ -n "$API_URL" ]; then
            curl -fsS "$API_URL/health" | grep -q '"status":"ok"'
          else
            echo "API_HEALTH_URL not set — skipping external health check"
          fi
