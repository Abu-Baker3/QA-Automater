# PgBouncer configuration — transaction pooling for NestJS/Prisma runtime connections
# Docs: packages/database/docs/connection-pooling.md

[databases]
qa_automater = host=postgres port=5432 dbname=qa_automater

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40
server_idle_timeout = 600
query_wait_timeout = 120
server_connect_timeout = 15
ignore_startup_parameters = extra_float_digits

log_connections = 1
log_disconnections = 1
stats_period = 60
